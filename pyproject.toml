[project]
name = "aivideoenhancer"
version = "0.1.0"
description = "AI Video Enhancer for local GPU processing"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "opencv-python",
    "tqdm",
    "numpy",
    "requests",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[tool.setuptools]
packages = ["utils"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }